[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editorial-platform"
version = "0.3.0"
description = "Configurable editorial processing engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "typer>=0.12", "rich>=13.7", "feedparser>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
openai = ["openai>=1.0"]

[project.scripts]
editorial = "editorial.cli:app"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
