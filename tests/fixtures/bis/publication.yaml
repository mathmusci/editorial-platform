publication:
  name: BIS Newsletter
  description: Test fixture for BIS-style editorial workflow
providers:
  - type: static
    name: BIS fixture provider
    articles:
      - title: "Industrial statistics"
        url: "https://example.org/industrial-statistics"
        source: "Fixture Source"
        authors: ["A. Statistician"]
        summary: "Industrial production statistics and business data."
        content: "Industrial statistics, forecasting, uncertainty and business data."
        metadata:
          section_hint: "Industry"
      - title: "Business forecasting"
        url: "https://example.org/business-forecasting"
        source: "Fixture Source"
        authors: ["B. Forecaster"]
        summary: "Forecasting for business and industrial planning."
        content: "Forecasting methods for industrial business data and uncertainty."
        metadata:
          section_hint: "Forecasting"
extractors:
  - type: reading_time
    name: Reading time
    words_per_minute: 200
evaluators:
  - type: rule_relevance
    name: BIS relevance
    include:
      - statistics
      - forecasting
      - uncertainty
      - data
      - industrial
      - business
    exclude:
      - football
      - celebrity
    weights:
      title: 5
      summary: 2
      content: 1
editorial_policy:
  maximum_age_days: 45
  maximum_articles: 12
  maximum_reading_minutes: 15
  statuses_eligible_for_issue: [accepted]
optimisation:
  strategy: greedy
  settings:
    max_articles: 2
    relevance_target_score: 40
    reading_time_target_minutes: 20
    reading_time_weight: 3
    mandatory_terms:
      - statistics
      - industry
    mandatory_terms_weight: 5
    source_diversity_max_per_source: 2
    source_diversity_weight: 2
