publication:
  name: BIS Newsletter
  description: Royal Statistical Society Business & Industrial Section newsletter
providers:
  # static provider example
  - type: static
    name: Sprint 1 sample provider
    articles:
      - title: ""
        url: "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Industrial_production_statistics"
        source: "Eurostat"
        authors: ["NA"]
        summary: "Industrial production statistics."
        metadata: {section_hint: "Industry"}
      - title: "Statistics"
        url: "https://en.wikipedia.org/wiki/Statistics"
        source: "Wikipedia"
        authors: ["A. Statistician", "B. Practitioner"]
        summary: "A wiki page on statistics."
        metadata: {section_hint: "Knowledge"}
  # RSS provider example:
  - type: rss
    name: RSS feed
    url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
    source: "BBC Science and Technology"
  - type: rss
    name: RSS feed
    url: "https://rss.arxiv.org/rss/cs"
    source: "Arxiv - Computer Science"
  - type: rss
    name: RSS feed
    url: "https://rss.arxiv.org/rss/econ"
    source: "Arxiv - Economics"
  - type: rss
    name: RSS feed
    url: "https://rss.arxiv.org/rss/stat"
    source: "Arxiv - Statistics"
extractors:
  - type: reading_time
    name: Reading time
    words_per_minute: 200
  - type: llm_summary
    name: LLM summary
    provider:
      type: fake
      response_text: "Configured validation summary."
      model: fake-summary-model
evaluators:
  - type: rule_relevance
    name: BIS relevance
    include:
      - statistics
      - optimisation
      - forecasting
      - uncertainty
      - data
      - industrial
      - business
    exclude:
      - football
      - celebrity
    weights:
      title: 5
      summary: 2
      content: 1
editorial_policy:
  maximum_age_days: 45
  maximum_articles: 12
  maximum_reading_minutes: 15
  statuses_eligible_for_issue: [accepted]
optimisation:
  strategy: greedy
  settings:
    max_articles: 8
    relevance_target_score: 40
    reading_time_target_minutes: 20
    reading_time_weight: 3
    mandatory_terms:
      - statistics
      - industry
    mandatory_terms_weight: 5
    source_diversity_max_per_source: 2
    source_diversity_weight: 2
publishers:
  - type: markdown
    template: templates/newsletter.md.j2
